<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<!-- Local font: npm i @fontsource/outfit (the player swaps it for Google Fonts) -->
<link rel="stylesheet" href="node_modules/@fontsource/outfit/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/outfit/700.css">
<style>
/* Design resolution must match FORMAT below (9:16 = 1080x1920, 16:9 = 1920x1080, 4:5 = 1080x1350). */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Outfit,sans-serif;color:#fff;
  background:radial-gradient(1300px 1000px at 50% 32%,#2a6fb5 0%,#1d4f86 50%,#0f2440 110%)}
.abs{position:absolute}
.scene{position:absolute;inset:0;opacity:0}
.kicker{left:60px;right:60px;top:200px;text-align:center;font:600 44px Outfit;letter-spacing:5px;text-transform:uppercase;opacity:.75}
.title{left:40px;right:40px;text-align:center;font:700 96px/1.08 Outfit}
.cap{left:60px;right:60px;text-align:center;font:600 62px/1.22 Outfit}
em{font-style:normal;color:#FFD24A}
/* kinetic words (layoutWords + kword): set --ink, --soft, --green, --orange on the scene or body */
.kw{display:inline-block;--kc:var(--ink,#fff);color:var(--kc)}
.kw.b{font-weight:800}.kw.g{--kc:var(--green,#7CDB8A)}.kw.o{--kc:var(--orange,#FFA83A)}.kw.y{--kc:#FFD24A}
.kw.ol{display:inline-grid}.kw.ol>i{grid-area:1/1;font-style:normal}.kw.ol>.st{color:#000}
</style></head><body>

<div class="scene" id="s1">
  <div class="abs title" id="t1" style="top:820px">Video <em>title</em></div>
</div>

<div class="scene" id="s2">
  <div class="abs kicker">Chapter</div>
  <div class="abs cap" id="c2" style="top:300px">Main idea of the <em>section</em></div>
  <svg class="abs" id="g2" width="960" height="600" style="left:60px;top:600px"></svg>
</div>

<script>
// ---------- format and timeline ----------
const FORMAT={w:1080,h:1920};
const T={s1:[0,3],s2:[3,10]};
const END=Math.max(...Object.values(T).map(v=>v[1]));

// ---------- helpers ----------
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);                       // ease-out
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const prog=(t,a,b)=>cl((t-a)/(b-a));
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function mk(svg,n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}
// deterministic random (mulberry32): same result on every seek(t)
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rise(el,t,a,dur=.5,dist=40){const p=eo(prog(t,a,a+dur));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dist}px)`}
// video clip in a scene (e.g. web.mp4 from record_web.py): <video id="v1" src="web.mp4" muted preload="auto" playsinline></video>
// vseek(video, time) moves the clip deterministically; render waits until done (window.__pending)
window.__pending=[];
function vseek(v,time){time=Math.max(0,Math.min(time,(v.duration||1e9)-0.04));if(Math.abs(v.currentTime-time)<1/120)return;
  window.__pending.push(new Promise(r=>v.addEventListener('seeked',r,{once:true})));v.currentTime=time}
// ---------- text: words appear in their final place, nothing jumps ----------
// layoutWords(el, text, {outline}) lays out the whole sentence once and returns the word elements.
// Markup: **word** = key word (bold), [g]word green, [o]word orange, [y]word yellow (all bold).
// outline: radius in px for captions over footage (a black copy under the text, round outline; 7 = medium).
function ringShadow(r,n=24){return[...Array(n)].map((_,i)=>`${(r*Math.cos(2*Math.PI*i/n)).toFixed(1)}px ${(r*Math.sin(2*Math.PI*i/n)).toFixed(1)}px 0 #000`).join(',')}
function layoutWords(el,text,{outline=0}={}){
  el.innerHTML=text.split(' ').map(w=>{let c='';const m=w.match(/^\[(g|o|y)\]/);
    if(m){c='b '+m[1];w=w.slice(3)}else if(w.startsWith('**')){c='b';w=w.replace(/\*\*/g,'')}
    if(!outline)return `<span class="kw ${c}">${w}</span>`;
    return `<span class="kw ol ${c}"><i class="st" style="text-shadow:${ringShadow(outline)},0 8px 22px rgba(0,0,0,.5)">${w}</i><i class="fi">${w}</i></span>`}).join(' ');
  const ws=[...el.querySelectorAll('.kw')];ws.forEach(w=>{w.style.opacity=0});return ws;
}
// kword: one word arrives at time a: from below, smaller, blurred, soft color; then turns to its final color.
function kword(el,t,a,{dy=34,blur=8,dur=.32}={}){
  const p=prog(t,a,a+dur),q=prog(t,a+.12,a+.4),e=eo(p);
  el.style.opacity=cl(p*3);el.style.transform=`translateY(${((1-e)*dy).toFixed(1)}px) scale(${(.86+.14*e).toFixed(3)})`;
  el.style.filter=p<1?`blur(${((1-e)*blur).toFixed(1)}px)`:'none';
  el.style.color=q<1?`color-mix(in srgb, var(--soft,#8FB0D6) ${Math.round((1-eo(q))*100)}%, var(--kc))`:'';
}
function kwords(ws,t,a,step=.2,opt){ws.forEach((w,i)=>kword(w,t,a+i*step,opt))}
// pop: simpler entrance for captions over footage (scale pop, no blur, no color change)
function popWord(el,t,a){const p=prog(t,a,a+.18);const c1=1.7,c3=2.7,x=p-1;el.style.opacity=cl(p*2.2);el.style.transform=`scale(${(.82+.18*(1+c3*x*x*x+c1*x*x)).toFixed(3)})`}
// blurOut: the whole scene blurs and fades before the next one
function blurOut(el,t,a,d=.35){const p=prog(t,a,a+d);el.style.opacity=1-p;el.style.filter=p>0?`blur(${(p*14).toFixed(1)}px)`:'none'}
// voCaption: captions from the voiceover (vo.js from align_voice.py). The text is cut into chunks of n words;
// each chunk is laid out once and every word appears at its spoken time. Usage: voCaption($('cap'),t,{n:7,outline:7})
function voCaption(el,t,{n=7,outline=7,mark={}}={}){
  if(!window.VO)return;const W=VO.words;let i=W.findIndex(x=>x.end>t);if(i<0)i=W.length-1;const c=Math.floor(i/n);
  if(el._chunk!==c){el._chunk=c;el._w=W.slice(c*n,c*n+n);el._ws=layoutWords(el,el._w.map(x=>mark[x.w]?mark[x.w]+x.w:x.w).join(' '),{outline})}
  el._ws.forEach((w,j)=>popWord(w,t,el._w[j].start));
}
function sceneOp(id,t){const [a,b]=T[id];if(t<a||t>b)return 0;return cl(Math.min((t-a)/.35,(b-t)/.35))}

// ---------- static elements (once) ----------
const r=rng(7);const line=mk($('g2'),'path',{fill:'none',stroke:'#FFD24A','stroke-width':6,pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1,
  d:[...Array(41)].map((_,i)=>(i?'L':'M')+(20+i*23)+','+(330-150*Math.sin(i/6)-r()*30)).join('')});

// ---------- state for time t ----------
function seek(t){
  for(const id in T)$(id).style.opacity=sceneOp(id,t);
  rise($('t1'),t,T.s1[0]+.3);
  {const a=T.s2[0];rise($('c2'),t,a+.2);line.setAttribute('stroke-dashoffset',1-ease(prog(t,a+.8,a+3)));}
}
window.seek=seek;window.T=T;window.FORMAT=FORMAT;seek(0);
</script>
</body></html>
