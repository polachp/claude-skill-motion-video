<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<!-- Písmo lokálně: npm i @fontsource/outfit (přehrávač ho nahradí Google Fonts) -->
<link rel="stylesheet" href="node_modules/@fontsource/outfit/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/outfit/700.css">
<style>
/* Návrhové rozlišení musí odpovídat FORMAT níže (9:16 = 1080x1920, 16:9 = 1920x1080). */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Outfit,sans-serif;color:#fff;
  background:radial-gradient(1300px 1000px at 50% 32%,#2a6fb5 0%,#1d4f86 50%,#0f2440 110%)}
.abs{position:absolute}
.scene{position:absolute;inset:0;opacity:0}
.kicker{left:60px;right:60px;top:200px;text-align:center;font:600 44px Outfit;letter-spacing:5px;text-transform:uppercase;opacity:.75}
.title{left:40px;right:40px;text-align:center;font:700 96px/1.08 Outfit}
.cap{left:60px;right:60px;text-align:center;font:600 62px/1.22 Outfit}
em{font-style:normal;color:#FFD24A}
</style></head><body>

<div class="scene" id="s1">
  <div class="abs title" id="t1" style="top:820px">Název <em>videa</em></div>
</div>

<div class="scene" id="s2">
  <div class="abs kicker">Kapitola</div>
  <div class="abs cap" id="c2" style="top:300px">Hlavní myšlenka <em>sekce</em></div>
  <svg class="abs" id="g2" width="960" height="600" style="left:60px;top:600px"></svg>
</div>

<script>
// ---------- formát a timeline ----------
const FORMAT={w:1080,h:1920};
const T={s1:[0,3],s2:[3,10]};
const END=Math.max(...Object.values(T).map(v=>v[1]));

// ---------- pomocné funkce ----------
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);                       // ease-out
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const prog=(t,a,b)=>cl((t-a)/(b-a));
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function mk(svg,n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}
// deterministická náhoda (mulberry32) – stejný výsledek při každém seek(t)
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rise(el,t,a,dur=.5,dist=40){const p=eo(prog(t,a,a+dur));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dist}px)`}
// video klip ve scéně (např. web.mp4 z record_web.py): <video id="v1" src="web.mp4" muted preload="auto" playsinline></video>
// vseek(video, čas) posune klip deterministicky; render počká na dokončení (window.__pending)
window.__pending=[];
function vseek(v,time){time=Math.max(0,Math.min(time,(v.duration||1e9)-0.04));if(Math.abs(v.currentTime-time)<1/120)return;
  window.__pending.push(new Promise(r=>v.addEventListener('seeked',r,{once:true})));v.currentTime=time}
// titulky slovo po slově z voiceoveru (vo.js z align_voice.py): wordCaption($('cap'),t)
function wordCaption(el,t,n=4){if(!window.voWordsAt)return;el.innerHTML=voWordsAt(t,n).map(w=>w.active?'<em>'+w.w+'</em>':w.w).join(' ')}
function sceneOp(id,t){const [a,b]=T[id];if(t<a||t>b)return 0;return cl(Math.min((t-a)/.35,(b-t)/.35))}

// ---------- statické prvky (jednou) ----------
const r=rng(7);const line=mk($('g2'),'path',{fill:'none',stroke:'#FFD24A','stroke-width':6,pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1,
  d:[...Array(41)].map((_,i)=>(i?'L':'M')+(20+i*23)+','+(330-150*Math.sin(i/6)-r()*30)).join('')});

// ---------- stav pro čas t ----------
function seek(t){
  for(const id in T)$(id).style.opacity=sceneOp(id,t);
  rise($('t1'),t,T.s1[0]+.3);
  {const a=T.s2[0];rise($('c2'),t,a+.2);line.setAttribute('stroke-dashoffset',1-ease(prog(t,a+.8,a+3)));}
}
window.seek=seek;window.T=T;window.FORMAT=FORMAT;seek(0);
</script>
</body></html>
